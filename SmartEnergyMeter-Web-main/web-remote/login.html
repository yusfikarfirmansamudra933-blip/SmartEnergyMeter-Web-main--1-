<!doctype html>
<html class="dark" lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0b1326;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#0b1326", "on-surface-variant": "#bbcabf", "surface-slate": "#1E293B", "on-primary-fixed": "#002113", "on-secondary-fixed-variant": "#004e5c", "tertiary": "#ffb95f", "outline": "#86948a", "primary": "#4edea3", "surface-container-high": "#222a3d", "on-tertiary-fixed": "#2a1700", "on-error-container": "#ffdad6", "background": "#0b1326", "tertiary-container": "#e29100", "secondary-fixed-dim": "#4cd7f6", "text-dim": "#94A3B8", "inverse-surface": "#dae2fd", "on-tertiary-container": "#523200", "surface-charcoal": "#0B1120", "on-secondary-container": "#00424e", "tertiary-fixed-dim": "#ffb95f", "danger-rose": "#F43F5E", "inverse-primary": "#006c49", "on-primary-container": "#00422b", "surface-bright": "#31394d", "inverse-on-surface": "#283044", "secondary-fixed": "#acedff", "primary-fixed-dim": "#4edea3", "on-surface": "#dae2fd", "surface-container-lowest": "#060e20", "on-primary": "#003824", "surface-container": "#171f33", "secondary": "#4cd7f6", "surface-dim": "#0b1326", "surface-container-low": "#131b2e", "surface-variant": "#2d3449", "error": "#ffb4ab", "secondary-container": "#03b5d3", "outline-variant": "#3c4a42", "on-secondary-fixed": "#001f26", "primary-container": "#10b981", "error-container": "#93000a", "on-secondary": "#003640", "tertiary-fixed": "#ffddb8", "surface-container-highest": "#2d3449", "on-error": "#690005", "on-primary-fixed-variant": "#005236", "surface-tint": "#4edea3", "primary-fixed": "#6ffbbe", "on-background": "#dae2fd", "on-tertiary-fixed-variant": "#653e00", "on-tertiary": "#472a00" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter-xs": "0.25rem", "gutter-sm": "0.5rem", "card-pad": "1.25rem", "gutter-lg": "1.5rem", "gutter-md": "1rem", "gutter-xl": "2rem", "panel-gap": "1rem" }, "fontFamily": { "headline-metric": ["Space Grotesk", "sans-serif"], "metric-unit": ["JetBrains Mono", "monospace"], "label-telemetry": ["JetBrains Mono", "monospace"], "body-md": ["Space Grotesk", "sans-serif"], "title-md": ["Space Grotesk", "sans-serif"], "display-lg": ["Space Grotesk", "sans-serif"], "body-sm": ["Space Grotesk", "sans-serif"], "headline-metric-mobile": ["Space Grotesk", "sans-serif"], "display-lg-mobile": ["Space Grotesk", "sans-serif"] }, "fontSize": { "headline-metric": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "metric-unit": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }], "label-telemetry": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "title-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-metric-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary">
<main class="flex flex-col items-center justify-center relative w-full min-h-screen px-gutter-md pt-safe pb-safe">

<div class="w-full max-w-sm flex flex-col items-center text-center space-y-gutter-xs mb-gutter-xl">
<div class="w-14 h-14 rounded-xl bg-primary-container/15 flex items-center justify-center text-primary mb-gutter-sm">
<span class="material-symbols-outlined text-[28px]">bolt</span>
</div>
<span class="font-label-telemetry text-label-telemetry text-secondary uppercase tracking-widest">SMART ENERGY METER</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-bold tracking-tight">Masuk ke akun</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Masukkan email, kami kirim link login — tidak perlu password.</p>
</div>

<div class="w-full max-w-sm rounded-xl bg-surface-container-low p-card-pad shadow-xl flex flex-col space-y-gutter-sm" id="formCard">
<label class="flex flex-col space-y-gutter-xs">
<span class="font-label-telemetry text-label-telemetry text-on-surface-variant uppercase tracking-wider">Email</span>
<input autocomplete="email" class="w-full rounded-lg bg-surface-charcoal border border-surface-container-highest px-3 py-2.5 text-on-surface font-body-md text-body-md outline-none focus:border-primary transition-colors" id="emailInput" placeholder="nama@email.com" type="email"/>
</label>
<button class="w-full rounded-lg bg-primary text-on-primary font-body-md text-body-md font-semibold py-2.5 transition-all active:scale-[0.98] disabled:opacity-50 disabled:active:scale-100" id="sendBtn" type="button">Kirim link login</button>
<p class="font-body-sm text-body-sm hidden" id="statusText"></p>
</div>

</main>

<script src="supabase-client.js"></script>
<script>
const emailInput = document.getElementById("emailInput");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("statusText");

function setStatus(message, isError) {
  statusText.textContent = message;
  statusText.classList.remove("hidden", "text-error", "text-primary");
  statusText.classList.add(isError ? "text-error" : "text-primary");
}

async function sendMagicLink() {
  const email = emailInput.value.trim();
  if (!email) { setStatus("Isi email dulu.", true); return; }

  sendBtn.disabled = true;
  setStatus("Mengirim...", false);

  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: `${location.origin}/devices.html` },
  });

  sendBtn.disabled = false;
  if (error) { setStatus(`Gagal: ${error.message}`, true); return; }
  setStatus(`Link login sudah dikirim ke ${email}. Cek inbox (dan folder spam).`, false);
}

sendBtn.addEventListener("click", sendMagicLink);
emailInput.addEventListener("keydown", (event) => { if (event.key === "Enter") sendMagicLink(); });

// Already signed in (or just landed here after clicking the email link
// with an even-older session still valid)? Skip straight to the dashboard.
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) location.href = "devices.html";
});
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#148a43">
  <title>Tagihan Listrik Bulanan</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .months-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
    .month-card { border: 1px solid var(--border); border-radius: 16px; padding: 22px 20px; min-height: 130px; cursor: pointer; text-align: left; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
    .month-card:hover { transform: translateY(-3px); border-color: var(--green-500); }
    .month-card h3 { margin: 0 0 10px; font-size: 1.1rem; }
    .month-card .month-total { font-size: 1.3rem; font-weight: 800; color: var(--green-700); margin-bottom: 6px; }
    .month-card small { color: var(--muted); }
    .month-overlay { position: fixed; inset: 0; z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(16,65,31,.35); backdrop-filter: blur(4px); }
    .month-overlay.show { display: flex; }
    .month-modal { width: min(700px, 100%); max-height: 85vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 26px; box-shadow: var(--shadow); }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 18px; }
    .close-modal { width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 50%; cursor: pointer; font-size: 22px; background: var(--surface); color: var(--ink); }
    .close-modal:hover { background: var(--green-100); }
    .week-list { display: grid; gap: 10px; }
    .week-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; }
    .week-row strong { display: block; margin-bottom: 4px; }
    .week-row small { color: var(--muted); }
    .week-bill { font-weight: 800; color: var(--green-700); }
    .empty-week { text-align: center; padding: 20px; color: var(--muted); }
    @media (max-width: 900px) { .months-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    @media (max-width: 650px) { .months-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 420px) { .months-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="app-header">
      <div>
        <p class="eyebrow">TAGIHAN LISTRIK</p>
        <h1>Estimasi tagihan bulanan.</h1>
        <p class="subtitle">Dihitung dari energi (kWh) yang dilaporkan perangkat lewat cloud.</p>
      </div>
      <div class="header-actions">
        <a class="button button-secondary" href="index.html">← Kembali ke Dashboard</a>
        <time id="clock">00:00:00</time>
      </div>
    </header>

    <section class="panel chart-panel">
      <div class="panel-heading"><div><p class="eyebrow">TREN</p><h2>Tagihan per bulan (tahun ini)</h2></div></div>
      <canvas id="billTrendChart" aria-label="Grafik tren tagihan bulanan" height="90"></canvas>
    </section>

    <section class="panel chart-panel">
      <div class="panel-heading"><div><p class="eyebrow">RINCIAN</p><h2>Tagihan per bulan</h2></div></div>
      <p class="muted">Pilih bulan untuk melihat rincian tagihan tiap minggu.</p>
      <div id="monthsGrid" class="months-grid"></div>
    </section>
  </main>

  <div id="monthOverlay" class="month-overlay" aria-hidden="true">
    <div class="month-modal" role="dialog" aria-modal="true" aria-labelledby="modalMonthTitle">
      <div class="modal-header">
        <div>
          <h2 id="modalMonthTitle">Januari</h2>
          <p id="modalMonthSummary" class="muted">Rincian tagihan mingguan</p>
        </div>
        <button type="button" id="closeModal" class="close-modal" aria-label="Tutup">×</button>
      </div>
      <div id="weekList" class="week-list"></div>
      <button type="button" id="downloadExcelBtn" class="button button-primary" style="width:100%;margin-top:18px;">⬇ Unduh rincian harian & mingguan (Excel)</button>
      <button type="button" id="downloadPdfBtn" class="button button-secondary" style="width:100%;margin-top:10px;">📄 Unduh rincian harian & mingguan (PDF)</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
"use strict";

// Read-only user (subscribe-only, cannot publish) — see web-remote/script.js.
const MQTT_WS_URL = "wss://l660c516.ala.eu-central-1.emqxsl.com:8084/mqtt";
const MQTT_USERNAME = "smartenergymeterweb";
const MQTT_PASSWORD = "sMch!JtGn5gpYD4";
const TOPIC_DATA = "smartmeter/data";

const monthsGrid = document.getElementById("monthsGrid");
const monthOverlay = document.getElementById("monthOverlay");
const closeModalBtn = document.getElementById("closeModal");
const modalMonthTitle = document.getElementById("modalMonthTitle");
const modalMonthSummary = document.getElementById("modalMonthSummary");
const weekList = document.getElementById("weekList");
const clockEl = document.getElementById("clock");

const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

let weeklyData = readObject("weeklyElectricity");
let dailyData = readObject("dailyElectricity");

function readObject(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "{}");
    return value && typeof value === "object" ? value : {};
  } catch { return {}; }
}

function formatRupiah(value) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(value) || 0);
}

function getElectricityRate() {
  const rate = Number(localStorage.getItem("electricityRate"));
  return Number.isFinite(rate) && rate > 0 ? rate : 1500;
}

function monthKey(year, monthIndex) {
  return year + "-" + String(monthIndex + 1).padStart(2, "0");
}

function dayKey(date) {
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
}

function getWeeklyBills(year, monthIndex) {
  const saved = weeklyData[monthKey(year, monthIndex)];
  if (saved && typeof saved === "object") {
    return [1,2,3,4,5].map(w => Number(saved["week" + w] || 0));
  }
  return [0,0,0,0,0];
}

function getMonthTotal(year, monthIndex) {
  return getWeeklyBills(year, monthIndex).reduce((sum, v) => sum + v, 0);
}

function renderMonthCards() {
  monthsGrid.innerHTML = "";
  const year = new Date().getFullYear();
  for (let month = 0; month < 12; month++) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "month-card";
    card.innerHTML = `<h3>${monthNames[month]}</h3><div class="month-total">${formatRupiah(getMonthTotal(year, month))}</div><small>Klik untuk melihat rincian →</small>`;
    card.addEventListener("click", () => openMonth(year, month));
    monthsGrid.appendChild(card);
  }
  renderTrendChart(year);
}

let trendChart;
function renderTrendChart(year) {
  const canvas = document.getElementById("billTrendChart");
  if (!canvas || typeof Chart === "undefined") return;
  const totals = monthNames.map((_, month) => getMonthTotal(year, month));
  const shortLabels = monthNames.map((name) => name.slice(0, 3));

  if (trendChart) {
    trendChart.data.datasets[0].data = totals;
    trendChart.update();
    return;
  }

  trendChart = new Chart(canvas.getContext("2d"), {
    type: "bar",
    data: {
      labels: shortLabels,
      datasets: [{
        label: "Tagihan (Rp)",
        data: totals,
        backgroundColor: "rgba(32,166,87,.35)",
        borderColor: "#148a43",
        borderWidth: 1.5,
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => formatRupiah(ctx.parsed.y) } },
      },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: "#e8efea" }, ticks: { callback: (v) => formatRupiah(v) } },
      },
    },
  });
}

let currentModalMonth = null;

function openMonth(year, monthIndex) {
  currentModalMonth = { year, monthIndex };
  const bills = getWeeklyBills(year, monthIndex);
  const total = bills.reduce((sum, v) => sum + v, 0);

  modalMonthTitle.textContent = `${monthNames[monthIndex]} ${year}`;
  modalMonthSummary.textContent = `Total bulan ini: ${formatRupiah(total)}`;
  weekList.innerHTML = "";

  let hasData = false;
  for (let i = 0; i < 5; i++) {
    const bill = bills[i];
    const start = new Date(year, monthIndex, 1 + i * 7);
    const lastDayOfMonth = new Date(year, monthIndex + 1, 0).getDate();
    const end = new Date(year, monthIndex, Math.min(1 + i * 7 + 6, lastDayOfMonth));

    const row = document.createElement("div");
    row.className = "week-row";
    row.innerHTML = `
      <div>
        <strong>Minggu ${i + 1}</strong>
        <small>${start.toLocaleDateString("id-ID")} - ${end.toLocaleDateString("id-ID")}</small>
      </div>
      <div class="week-bill">${formatRupiah(bill)}</div>
    `;
    weekList.appendChild(row);
    if (bill > 0) hasData = true;
  }

  if (!hasData) {
    const note = document.createElement("div");
    note.className = "empty-week";
    note.textContent = "Belum ada data tagihan mingguan untuk bulan ini.";
    weekList.appendChild(note);
  }

  monthOverlay.classList.add("show");
  monthOverlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeMonth() {
  monthOverlay.classList.remove("show");
  monthOverlay.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

function downloadMonthExcel() {
  if (!currentModalMonth || typeof XLSX === "undefined") return;
  const { year, monthIndex } = currentModalMonth;
  const rate = getElectricityRate();
  const lastDayOfMonth = new Date(year, monthIndex + 1, 0).getDate();

  // Layout menyamping: hari jadi kolom, tiap minggu ringkas jadi 2 baris (kWh & Rp).
  const rows = [["Minggu", "Rincian", "Hari 1", "Hari 2", "Hari 3", "Hari 4", "Hari 5", "Hari 6", "Hari 7", "Total"]];
  const merges = [];
  let rowIndex = 1;
  let grandTotal = 0;

  for (let week = 0; 1 + week * 7 <= lastDayOfMonth && week < 5; week++) {
    const weekStartDay = 1 + week * 7;
    const weekEndDay = Math.min(weekStartDay + 6, lastDayOfMonth);
    const weekStart = new Date(year, monthIndex, weekStartDay);
    const weekEnd = new Date(year, monthIndex, weekEndDay);
    const weekLabel = `Minggu ${week + 1}\n${weekStart.toLocaleDateString("id-ID")} - ${weekEnd.toLocaleDateString("id-ID")}`;

    const kwhRow = [weekLabel, "Pemakaian (kWh)"];
    const rpRow = ["", "Tagihan (Rp)"];
    let weekTotal = 0;

    for (let day = weekStartDay; day <= weekStartDay + 6; day++) {
      if (day > weekEndDay) { kwhRow.push(""); rpRow.push(""); continue; }
      const date = new Date(year, monthIndex, day);
      const dayBill = Number(dailyData[dayKey(date)] || 0);
      const dayKwh = rate > 0 ? dayBill / rate : 0;
      kwhRow.push(Number(dayKwh.toFixed(3)));
      rpRow.push(Math.round(dayBill));
      weekTotal += dayBill;
    }

    kwhRow.push(rate > 0 ? Number((weekTotal / rate).toFixed(3)) : 0);
    rpRow.push(Math.round(weekTotal));
    rows.push(kwhRow, rpRow);

    // Gabung sel label minggu supaya rapi menyamping di 2 baris (kWh + Rp).
    merges.push({ s: { r: rowIndex, c: 0 }, e: { r: rowIndex + 1, c: 0 } });
    rowIndex += 2;
    grandTotal += weekTotal;
  }

  rows.push(["Total Bulan", "", "", "", "", "", "", "", "", Math.round(grandTotal)]);

  const sheet = XLSX.utils.aoa_to_sheet(rows);
  sheet["!cols"] = [{ wch: 22 }, { wch: 16 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 14 }];
  sheet["!merges"] = merges;

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, sheet, "Rincian");
  XLSX.writeFile(workbook, `Tagihan-${monthNames[monthIndex]}-${year}.xlsx`);
}

function downloadMonthPdf() {
  if (!currentModalMonth || typeof window.jspdf === "undefined") return;
  const { year, monthIndex } = currentModalMonth;
  const rate = getElectricityRate();
  const lastDayOfMonth = new Date(year, monthIndex + 1, 0).getDate();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape" });

  doc.setFontSize(14);
  doc.text(`Tagihan Listrik - ${monthNames[monthIndex]} ${year}`, 14, 15);

  const head = [["Minggu", "Rincian", "Hari 1", "Hari 2", "Hari 3", "Hari 4", "Hari 5", "Hari 6", "Hari 7", "Total"]];
  const body = [];
  let grandTotal = 0;

  for (let week = 0; 1 + week * 7 <= lastDayOfMonth && week < 5; week++) {
    const weekStartDay = 1 + week * 7;
    const weekEndDay = Math.min(weekStartDay + 6, lastDayOfMonth);
    const weekStart = new Date(year, monthIndex, weekStartDay);
    const weekEnd = new Date(year, monthIndex, weekEndDay);
    const weekLabel = `Minggu ${week + 1}\n${weekStart.toLocaleDateString("id-ID")} - ${weekEnd.toLocaleDateString("id-ID")}`;

    const kwhRow = [weekLabel, "Pemakaian (kWh)"];
    const rpRow = [weekLabel, "Tagihan (Rp)"];
    let weekTotal = 0;

    for (let day = weekStartDay; day <= weekStartDay + 6; day++) {
      if (day > weekEndDay) { kwhRow.push(""); rpRow.push(""); continue; }
      const date = new Date(year, monthIndex, day);
      const dayBill = Number(dailyData[dayKey(date)] || 0);
      const dayKwh = rate > 0 ? dayBill / rate : 0;
      kwhRow.push(dayKwh.toFixed(3));
      rpRow.push(formatRupiah(dayBill));
      weekTotal += dayBill;
    }

    kwhRow.push(rate > 0 ? (weekTotal / rate).toFixed(3) : "0");
    rpRow.push(formatRupiah(weekTotal));
    body.push(kwhRow, rpRow);
    grandTotal += weekTotal;
  }

  body.push(["Total Bulan", "", "", "", "", "", "", "", "", formatRupiah(grandTotal)]);

  doc.autoTable({
    head,
    body,
    startY: 22,
    styles: { fontSize: 8, cellPadding: 2, valign: "middle" },
    headStyles: { fillColor: [20, 138, 67] },
    columnStyles: { 0: { cellWidth: 40 }, 1: { cellWidth: 30 } },
  });

  doc.save(`Tagihan-${monthNames[monthIndex]}-${year}.pdf`);
}

document.getElementById("downloadExcelBtn").addEventListener("click", downloadMonthExcel);
document.getElementById("downloadPdfBtn").addEventListener("click", downloadMonthPdf);
closeModalBtn.addEventListener("click", closeMonth);
monthOverlay.addEventListener("click", e => { if (e.target === monthOverlay) closeMonth(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMonth(); });

function saveWeeklyEnergy(energy) {
  if (!Number.isFinite(energy)) return;

  const now = new Date();
  const year = now.getFullYear();
  const monthIndex = now.getMonth();
  const key = monthKey(year, monthIndex);
  // Tanggal 1-7 = minggu 1, 8-14 = minggu 2, ... 29-31 = minggu 5
  const week = Math.min(Math.floor((now.getDate() - 1) / 7) + 1, 5);

  let starts = readObject("weeklyEnergyStart");
  if (!starts[key]) starts[key] = {};
  if (starts[key]["week" + week] === undefined) {
    starts[key]["week" + week] = energy;
    localStorage.setItem("weeklyEnergyStart", JSON.stringify(starts));
  }

  let usedEnergy = energy - Number(starts[key]["week" + week]);
  if (usedEnergy < 0) {
    starts[key]["week" + week] = energy;
    usedEnergy = 0;
    localStorage.setItem("weeklyEnergyStart", JSON.stringify(starts));
  }

  if (!weeklyData[key]) weeklyData[key] = {};
  weeklyData[key]["week" + week] = usedEnergy * getElectricityRate();
  localStorage.setItem("weeklyElectricity", JSON.stringify(weeklyData));

  renderMonthCards();
}

function saveDailyEnergy(energy) {
  if (!Number.isFinite(energy)) return;

  const key = dayKey(new Date());

  let starts = readObject("dailyEnergyStart");
  if (starts[key] === undefined) {
    starts[key] = energy;
    localStorage.setItem("dailyEnergyStart", JSON.stringify(starts));
  }

  let usedEnergy = energy - Number(starts[key]);
  if (usedEnergy < 0) {
    starts[key] = energy;
    usedEnergy = 0;
    localStorage.setItem("dailyEnergyStart", JSON.stringify(starts));
  }

  dailyData[key] = usedEnergy * getElectricityRate();
  localStorage.setItem("dailyElectricity", JSON.stringify(dailyData));
}

let mqttClient = null;
function connectMQTT() {
  mqttClient = mqtt.connect(MQTT_WS_URL, {
    username: MQTT_USERNAME,
    password: MQTT_PASSWORD,
    clientId: "bill-" + Math.random().toString(16).slice(2),
    reconnectPeriod: 3000,
  });
  mqttClient.on("connect", () => mqttClient.subscribe(TOPIC_DATA));
  mqttClient.on("message", (topic, message) => {
    if (topic !== TOPIC_DATA) return;
    try {
      const data = JSON.parse(message.toString());
      if (data.energy !== undefined) {
        const energy = Number(data.energy);
        saveWeeklyEnergy(energy);
        saveDailyEnergy(energy);
      }
    } catch { /* ignore malformed packet */ }
  });
}

function updateClock() { clockEl.textContent = new Date().toLocaleTimeString("id-ID"); }
setInterval(updateClock, 1000);

window.addEventListener("load", () => {
  renderMonthCards();
  updateClock();
  connectMQTT();
});
  </script>
</body>
</html>

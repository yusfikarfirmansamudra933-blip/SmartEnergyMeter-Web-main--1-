<!doctype html>
<html class="dark" lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Device Saya</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0b1326;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#0b1326", "on-surface-variant": "#bbcabf", "surface-slate": "#1E293B", "on-primary-fixed": "#002113", "on-secondary-fixed-variant": "#004e5c", "tertiary": "#ffb95f", "outline": "#86948a", "primary": "#4edea3", "surface-container-high": "#222a3d", "on-tertiary-fixed": "#2a1700", "on-error-container": "#ffdad6", "background": "#0b1326", "tertiary-container": "#e29100", "secondary-fixed-dim": "#4cd7f6", "text-dim": "#94A3B8", "inverse-surface": "#dae2fd", "on-tertiary-container": "#523200", "surface-charcoal": "#0B1120", "on-secondary-container": "#00424e", "tertiary-fixed-dim": "#ffb95f", "danger-rose": "#F43F5E", "inverse-primary": "#006c49", "on-primary-container": "#00422b", "surface-bright": "#31394d", "inverse-on-surface": "#283044", "secondary-fixed": "#acedff", "primary-fixed-dim": "#4edea3", "on-surface": "#dae2fd", "surface-container-lowest": "#060e20", "on-primary": "#003824", "surface-container": "#171f33", "secondary": "#4cd7f6", "surface-dim": "#0b1326", "surface-container-low": "#131b2e", "surface-variant": "#2d3449", "error": "#ffb4ab", "secondary-container": "#03b5d3", "outline-variant": "#3c4a42", "on-secondary-fixed": "#001f26", "primary-container": "#10b981", "error-container": "#93000a", "on-secondary": "#003640", "tertiary-fixed": "#ffddb8", "surface-container-highest": "#2d3449", "on-error": "#690005", "on-primary-fixed-variant": "#005236", "surface-tint": "#4edea3", "primary-fixed": "#6ffbbe", "on-background": "#dae2fd", "on-tertiary-fixed-variant": "#653e00", "on-tertiary": "#472a00" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter-xs": "0.25rem", "gutter-sm": "0.5rem", "card-pad": "1.25rem", "gutter-lg": "1.5rem", "gutter-md": "1rem", "gutter-xl": "2rem", "panel-gap": "1rem" }, "fontFamily": { "headline-metric": ["Space Grotesk", "sans-serif"], "metric-unit": ["JetBrains Mono", "monospace"], "label-telemetry": ["JetBrains Mono", "monospace"], "body-md": ["Space Grotesk", "sans-serif"], "title-md": ["Space Grotesk", "sans-serif"], "display-lg": ["Space Grotesk", "sans-serif"], "body-sm": ["Space Grotesk", "sans-serif"], "headline-metric-mobile": ["Space Grotesk", "sans-serif"], "display-lg-mobile": ["Space Grotesk", "sans-serif"] }, "fontSize": { "headline-metric": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "metric-unit": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }], "label-telemetry": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "title-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-metric-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary">
<main class="flex flex-col relative w-full pt-safe pb-24 bg-surface min-h-screen" hidden id="page">
<div class="flex flex-col w-full px-gutter-md space-y-panel-gap pt-gutter-md">

<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-telemetry text-label-telemetry text-secondary uppercase tracking-widest">SMART ENERGY METER</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-bold tracking-tight">Device Saya</h1>
</div>
<button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high transition-all text-on-surface-variant active:scale-95" id="logoutBtn" type="button">
<span class="material-symbols-outlined text-[18px]">logout</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant" id="whoami">-</p>

<div class="flex flex-col space-y-gutter-sm" id="deviceList"></div>

<div class="w-full rounded-xl bg-surface-container-low p-card-pad shadow-lg flex flex-col space-y-gutter-sm">
<div class="flex flex-col">
<span class="font-label-telemetry text-label-telemetry text-secondary uppercase tracking-wider">TAMBAH DEVICE</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Kode pairing otomatis dari OLED belum aktif (menyusul di firmware) — untuk sekarang, isi manual sesuai ID yang dipakai perangkat.</p>
</div>
<label class="flex flex-col space-y-gutter-xs">
<span class="font-label-telemetry text-label-telemetry text-on-surface-variant uppercase tracking-wider">Nama device</span>
<input class="w-full rounded-lg bg-surface-charcoal border border-surface-container-highest px-3 py-2.5 text-on-surface font-body-md text-body-md outline-none focus:border-primary transition-colors" id="newDeviceName" placeholder="misal: Meter Rumah"/>
</label>
<label class="flex flex-col space-y-gutter-xs">
<span class="font-label-telemetry text-label-telemetry text-on-surface-variant uppercase tracking-wider">Device ID</span>
<input class="w-full rounded-lg bg-surface-charcoal border border-surface-container-highest px-3 py-2.5 text-on-surface font-metric-unit text-metric-unit outline-none focus:border-primary transition-colors" id="newDeviceId" placeholder="misal: meter-rumah-01"/>
</label>
<button class="w-full rounded-lg bg-primary text-on-primary font-body-md text-body-md font-semibold py-2.5 transition-all active:scale-[0.98] disabled:opacity-50 disabled:active:scale-100" id="addDeviceBtn" type="button">Tambah</button>
<p class="font-body-sm text-body-sm hidden" id="formStatus"></p>
</div>

<div class="w-full rounded-xl bg-surface-container-low p-card-pad shadow-lg flex items-center gap-3 opacity-60">
<div class="w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center text-secondary shrink-0"><span class="material-symbols-outlined text-[18px]">send</span></div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-semibold">Hubungkan Telegram</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Segera hadir — bot Telegram belum terhubung ke akun.</span>
</div>
</div>

</div>
</main>

<script src="supabase-client.js"></script>
<script>
const deviceListEl = document.getElementById("deviceList");
const whoamiEl = document.getElementById("whoami");
const pageEl = document.getElementById("page");
const formStatus = document.getElementById("formStatus");

function setFormStatus(message, isError) {
  formStatus.textContent = message;
  formStatus.classList.remove("hidden", "text-error", "text-primary");
  formStatus.classList.add(isError ? "text-error" : "text-primary");
}

function deviceCard(device) {
  const card = document.createElement("div");
  card.className = "w-full rounded-xl bg-surface-container-low p-card-pad shadow-lg flex items-center justify-between";
  card.innerHTML = `
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-lg bg-primary-container/15 flex items-center justify-center text-primary shrink-0">
        <span class="material-symbols-outlined text-[20px]">bolt</span>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="font-body-md text-body-md text-on-surface font-semibold truncate">${device.name}</span>
        <span class="font-metric-unit text-metric-unit text-on-surface-variant truncate">${device.id} • ${device.power_limit}W</span>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <a class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-surface-container hover:bg-surface-container-high transition-all text-secondary" href="index.html" title="Buka dashboard">
        <span class="material-symbols-outlined text-[18px]">open_in_new</span>
      </a>
      <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-surface-container hover:bg-error-container/40 transition-all text-error deleteBtn" data-id="${device.id}" title="Hapus" type="button">
        <span class="material-symbols-outlined text-[18px]">delete</span>
      </button>
    </div>
  `;
  card.querySelector(".deleteBtn").addEventListener("click", () => deleteDevice(device.id));
  return card;
}

async function loadDevices() {
  const { data, error } = await supabaseClient.from("devices").select("*").order("created_at");
  if (error) { deviceListEl.innerHTML = `<p class="font-body-sm text-body-sm text-error">Gagal memuat device: ${error.message}</p>`; return; }

  deviceListEl.innerHTML = "";
  if (!data.length) {
    const empty = document.createElement("p");
    empty.className = "font-body-sm text-body-sm text-on-surface-variant";
    empty.textContent = "Belum ada device. Tambahkan lewat form di bawah.";
    deviceListEl.appendChild(empty);
    return;
  }
  data.forEach((device) => deviceListEl.appendChild(deviceCard(device)));
}

async function addDevice() {
  const name = document.getElementById("newDeviceName").value.trim();
  const id = document.getElementById("newDeviceId").value.trim();
  if (!name || !id) { setFormStatus("Isi nama dan device ID dulu.", true); return; }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { location.href = "login.html"; return; }

  setFormStatus("Menyimpan...", false);
  const { error } = await supabaseClient.from("devices").insert({
    id,
    owner_user_id: session.user.id,
    name,
    mqtt_topic_prefix: `smartmeter/${id}`,
  });

  if (error) { setFormStatus(`Gagal: ${error.message}`, true); return; }
  document.getElementById("newDeviceName").value = "";
  document.getElementById("newDeviceId").value = "";
  setFormStatus("Device ditambahkan.", false);
  loadDevices();
}

async function deleteDevice(id) {
  if (!confirm("Hapus device ini dari akun?")) return;
  const { error } = await supabaseClient.from("devices").delete().eq("id", id);
  if (error) { alert(`Gagal menghapus: ${error.message}`); return; }
  loadDevices();
}

document.getElementById("addDeviceBtn").addEventListener("click", addDevice);
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  location.href = "login.html";
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { location.href = "login.html"; return; }
  whoamiEl.textContent = session.user.email;
  pageEl.hidden = false;
  loadDevices();
})();
</script>
</body>
</html>
